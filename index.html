<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EDE2">
<title>Quiz interactif · Débitmètres</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%230F1E2B'/><path d='M8 16h16M16 8v16' stroke='%23F1EDE2' stroke-width='3'/></svg>">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('qd_theme')==='dark'?'dark':'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div id="app" class="screen"></div>
<button id="theme-toggle" class="theme-btn" type="button" aria-label="Basculer clair / sombre" title="Thème">◐</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="config.js?v=11"></script>
<script src="js/qrcode.js?v=11"></script>
<script src="js/core.js?v=11"></script>
<script src="js/player.js?v=11"></script>
<script src="js/admin.js?v=11"></script>
<script src="js/ceremony.js?v=11"></script>
<script src="js/host.js?v=11"></script>
<script src="app.js?v=11"></script>
<script>
(function(){
  const btn = document.getElementById('theme-toggle');
  if (!btn) return;
  const apply = t => { document.documentElement.dataset.theme = t; try{localStorage.setItem('qd_theme', t)}catch(e){} };
  btn.onclick = () => apply(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
})();
</script>
</body>
</html>
